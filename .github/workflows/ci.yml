name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev --group builders
      - name: Run tests
        run: uv run pytest tests -q
      - name: Dashboard builds
        run: uv run python tools/build_job_dashboard.py
